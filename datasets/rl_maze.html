<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Agent</title>
  <style>
    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        color: white;
        font-family: monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }
    button{
        border: solid greenyellow 2px;
        background-color: black;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        margin: 10px;
        transition: all 0.2s ease-in-out;
        cursor: pointer;
    }
    button:hover{
        transform: scale(1.1);
    }
    .playground {
        border: solid greenyellow 2px;
        display: grid;
        grid-template-columns: repeat(10, 25px);
        grid-template-rows: repeat(10, 25px);
    }
    .tile {
        width: 25px;
        height: 25px;
        background-color: black;
    }
    .agent {
        background-color: cyan;
    }
    .wall {
        background-color: greenyellow;
    }
    .goal {
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
  </style>
</head>
<body>
  <button id="pauseBtn">Pause</button>
  <div class="playground"></div>
  <script>
    const width = 10;
    const height = 10;
    const playground = document.querySelector(".playground");
    const grid = [];
    let agent = { i: 0, j: 0 };
    const goal = { i: 1, j: width - 2 };
    let episode = 0;
    let speed = 20;
    let qTable = {};
    const alpha = 0.75; // Learning rate
    const gamma = 0.9;  // Discount factor
    let epsilon = 0.9;  // Exploration rate
    const epsilonDecay = 0.99;
    const minEpsilon = 0.1;
    let isPaused = false;
    let bestCostSoFar = Infinity;

    document.getElementById("pauseBtn").addEventListener("click", () => {
        isPaused = !isPaused;
        if (isPaused) {
            console.log(`⏸️ Paused! Best cost so far: ${bestCostSoFar}`);
        } else {
            console.log("▶️ Resumed!");
        }
    });

    // Creating the grid
    for (let i = 0; i < height; i++) {
        grid[i] = [];
        for (let j = 0; j < width; j++) {
            const tile = document.createElement("div");
            tile.className = "tile";
            playground.appendChild(tile);
            grid[i][j] = tile;
        }
    }

    function placeWalls() {
        for(let i = 0; i<6; i++){
            grid[i][1].classList.add("wall");
            grid[height-2-i][8].classList.add("wall");
            grid[3][i+4].classList.add("wall");
            grid[6][i+1].classList.add("wall");
        }
        grid[3][9].classList.remove("wall");
        grid[3][1].classList.remove("wall");
    }

    function placeGoal() {
        grid[goal.i][goal.j].classList.add("goal");
        grid[goal.i][goal.j].textContent = "🍎";
    }

    function clearAgent() {
        for (let row of grid) {
            for (let tile of row) {
                tile.classList.remove("agent");
            }
        }
    }

    function runEpisode() {
        if (isPaused) return;
        // Initial state of the agent
        agent = { i: 0, j: 0 };
        let steps = 0;

        // An episode's loop
        const interval = setInterval(() => {
            if (isPaused) return;
            const state = getState(agent.i, agent.j);
            const action = chooseAction(state);
            const { ni, nj } = getNewPosition(agent.i, agent.j, action);

            if (!isWall(ni, nj)) {
                const reward = (ni === goal.i && nj === goal.j) ? 10 : -0.1;
                const nextState = getState(ni, nj);

                if (!qTable[nextState]) {
                    qTable[nextState] = { "up": 0, "down": 0, "left": 0, "right": 0 };
                }

                const maxQNext = Math.max(...Object.values(qTable[nextState]));
                qTable[state][action] += alpha * (reward + gamma * maxQNext - qTable[state][action]);

                agent.i = ni;
                agent.j = nj;
                steps++;

                clearAgent();
                grid[agent.i][agent.j].classList.add("agent");

                if (agent.i === goal.i && agent.j === goal.j) {
                    clearInterval(interval);
                    episode++;
                    epsilon = Math.max(minEpsilon, epsilon * epsilonDecay);
                    console.log(`Ep. ${episode} --> ${steps}`);
                    if (steps<bestCostSoFar) bestCostSoFar = steps;
                    if (!isPaused){
                        runEpisode();
                    }
                }
            } else {
                // Penalty for hitting wall
                qTable[state][action] += alpha * (-1 - qTable[state][action]);
            }
        }, speed);
    }


    function getState(i, j) {
        return `${i},${j}`;
    }

    function chooseAction(state) {
        if (!qTable[state]) {
            qTable[state] = {"up":0, "down":0, "left":0, "right":0};
        }

        if (Math.random() < epsilon) {
            const actions = ["up", "down", "left", "right"];
            return actions[Math.floor(Math.random() * 4)];
        }

        // Greedy action
        let max = -Infinity;
        let bestAction = null;
        for (let a in qTable[state]) {
            if (qTable[state][a] > max) {
                max = qTable[state][a];
                bestAction = a;
            }
        }
        return bestAction;
    }

    function getNewPosition(i, j, action) {
        if (action === "up") i--;
        else if (action === "down") i++;
        else if (action === "left") j--;
        else if (action === "right") j++;
        return { ni: i, nj: j };
    }

    function isWall(i, j) {
        return (
            i < 0 || j < 0 || i >= height || j >= width ||
            grid[i][j].classList.contains("wall")
        );
    }

    placeWalls();
    placeGoal();
    runEpisode();
  </script>
</body>
</html>
